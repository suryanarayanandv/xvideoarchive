spring.datasource.url=jdbc:h2:mem:xeditarchive;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.jpa.show-sql=false
# Tests never reach AudD unless they opt in (LiveAuddPipelineTest) or mock the client.
recognition.audd.enabled=false
recognition.audd.api-token=
