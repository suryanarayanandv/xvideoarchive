spring.application.name=x-edit-archive
spring.datasource.url=jdbc:h2:mem:xeditarchive;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false
server.port=8080
recognition.audd.enabled=${AUDD_ENABLED:true}
recognition.audd.api-token=${AUDD_API_TOKEN:}
recognition.audd.endpoint=${AUDD_API_URL:https://api.audd.io/}

# Media provider: none | x-api | local-sample
media.provider=${MEDIA_PROVIDER:none}
media.max-download-bytes=${MEDIA_MAX_DOWNLOAD_BYTES:104857600}
media.max-video-duration-seconds=${MEDIA_MAX_VIDEO_DURATION_SECONDS:600}
media.connect-timeout=${MEDIA_CONNECT_TIMEOUT:10s}
media.download-timeout=${MEDIA_DOWNLOAD_TIMEOUT:60s}
media.ffmpeg-timeout=${MEDIA_FFMPEG_TIMEOUT:60s}
media.allowed-hosts=${MEDIA_ALLOWED_HOSTS:video.twimg.com}
media.temp-dir=${MEDIA_TEMP_DIR:}
media.x-api.base-url=${X_API_BASE_URL:https://api.x.com}
media.x-api.bearer-token=${X_BEARER_TOKEN:}
media.local-sample.directory=${MEDIA_SAMPLE_DIR:}
jobs.max-attempts=${JOBS_MAX_ATTEMPTS:5}
